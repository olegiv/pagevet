# golangci-lint v1 SCHEMA (validated against v1.64.8).
# Do NOT migrate to v2 syntax without bumping the binary: the v2 keys
# `version:`, `linters.default:`, `linters.settings:` and `formatters:` are
# silently rejected by v1, which would leave this project effectively unlinted.
#
# staticcheck / gosimple / stylecheck are BUNDLED in golangci-lint; do not
# install honnef.co/go/tools separately.

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - staticcheck
    - stylecheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign

linters-settings:
  errcheck:
    check-type-assertions: true
    # check-blank stays OFF. In Go, `_ = f()` is the idiomatic way to say
    # "I looked at this error and it is not actionable", and the handful of
    # sites that do it here are all of that kind: dismissing a dialog on a tab
    # that may already be closing, the post-load settle sleep, the polite
    # browser shutdown before we kill the process anyway. Each carries a
    # comment saying why. Turning this on would replace those explicit,
    # greppable blanks with wrapper functions that hide the same decision.
    # Genuinely unchecked returns - the case that matters - are still caught.
    check-blank: false
  govet:
    enable-all: true
    disable:
      # Field alignment is a micro-optimization that fights readability in the
      # Result struct, whose field order is documentation.
      - fieldalignment
  gosec:
    config:
      G301: "0700"
      G302: "0600"
      G306: "0600"
  nolintlint:
    # Any suppression that survives must name its rule and justify itself.
    allow-unused: false
    require-explanation: true
    require-specific: true
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Table-driven tests legitimately carry long literal blocks and duplicated
    # setup; the value is in the coverage, not in the DRY-ness.
    - path: _test\.go
      linters:
        - unparam
        - gocritic
